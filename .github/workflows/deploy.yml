name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so page dates come from each file's last commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Copy local plugins into .quartz/plugins/ (replaces the Windows sync-plugins.mjs approach)
      - name: Sync local plugins
        run: |
          mkdir -p .quartz/plugins
          cp -r plugins/exclude-unpublished .quartz/plugins/
          cp -r plugins/remove-dm-spoilers .quartz/plugins/

      - run: npx quartz build -d content

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
