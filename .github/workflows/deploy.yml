name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so page dates come from each file's last commit

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Copy local plugins into .quartz/plugins/ (replaces the Windows sync-plugins.mjs approach)
      - name: Sync local plugins
        run: |
          mkdir -p .quartz/plugins
          cp -r plugins/* .quartz/plugins/

      - run: npx quartz build -d content

      # DM dashboard extras, written straight into the built site:
      # the monster library (every [!statblock] in the vault) and a copy of the
      # dice roller so the dashboard can share the 3D dice.
      - name: DM dashboard data
        run: |
          node scripts/build-monsters.mjs content public/static/dm/monsters.json
          cp plugins/dice-roller/dist/client.js public/static/dice-roller.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
